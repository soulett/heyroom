<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">⌂</div><div><div class="brand-name">同屋</div><div class="brand-en">ROOM TOGETHER</div></div></div>
      <div class="side-label">生活管理</div>
      <nav class="nav" aria-label="主导航">
        <button data-page="home" class="active"><span class="ico">▦</span> 总览</button>
        <button data-page="expenses"><span class="ico">◫</span> 费用 AA <span class="count" id="sideDue">0</span></button>
        <button data-page="chores"><span class="ico">◈</span> 清洁值日</button>
        <button data-page="inventory"><span class="ico">▤</span> 公共物品</button>
        <button data-page="rules"><span class="ico">☷</span> 室友公约</button>
      </nav>
      <div class="sidebar-bottom"><div class="home-pill"><div class="house">⌂</div><div><strong>梧桐里 · 302</strong><small>4 位室友的温暖小家</small></div></div><div class="side-foot">同屋 Demo · 数据保存在此浏览器</div></div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="crumb">我的合租空间 <span style="margin:0 9px;color:#ced6cd">/</span> <b id="crumbTitle">总览</b></div><div class="top-actions"><span class="today" id="today"></span><div class="avatar-stack" id="avatarStack"></div><button class="avatar-me" title="当前身份：小林">林</button></div></header>
      <div class="content">
        <section id="home" class="page active"></section>
        <section id="expenses" class="page"></section>
        <section id="chores" class="page"></section>
        <section id="inventory" class="page"></section>
        <section id="rules" class="page"></section>
        <div class="demo-note"><span>✦ 演示模式：当前身份是小林。操作会保存在当前浏览器，刷新页面也不会丢失。</span><button id="resetDemo">重置演示数据 ↻</button></div>
      </div>
    </main>
  </div>
  <nav class="mobile-nav" aria-label="移动端导航">
    <button data-page="home" class="active"><span>▦</span>总览</button><button data-page="expenses"><span>◫</span>费用</button><button data-page="chores"><span>◈</span>值日</button><button data-page="inventory"><span>▤</span>物品</button><button data-page="rules"><span>☷</span>公约</button>
  </nav>
  <div class="modal-backdrop" id="modalBackdrop" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle"></h2><button class="icon-btn" id="closeModal" aria-label="关闭">×</button></div><div class="modal-body" id="modalBody"></div></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const KEY='heyroom-demo-v1';
    const members=[{id:'lin',name:'小林',char:'林',bg:'#d8eedf',color:'#387751'},{id:'qing',name:'阿青',char:'青',bg:'#e5e8ff',color:'#686fad'},{id:'ke',name:'可可',char:'可',bg:'#ffead9',color:'#be8250'},{id:'an',name:'安安',char:'安',bg:'#f9e1e8',color:'#b47586'}];
    const todayISO=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
    function seed(){return {expenses:[{id:'e1',title:'十月电费',amount:240,payer:'lin',people:['lin','qing','ke','an'],settled:['lin','an'],date:todayISO(),icon:'⚡'},{id:'e2',title:'周末采购 · 日用品',amount:86.4,payer:'qing',people:['lin','qing','ke','an'],settled:['qing','ke'],date:todayISO(),icon:'🛒'},{id:'e3',title:'宽带月费',amount:120,payer:'ke',people:['lin','qing','ke','an'],settled:['ke','lin','qing','an'],date:todayISO(),icon:'⌁'}],chores:[{id:'c1',title:'厨房清洁',icon:'🍳',desc:'擦拭台面、清理水槽和灶台',owner:'qing',done:false},{id:'c2',title:'倒垃圾',icon:'🗑️',desc:'分类打包并更换垃圾袋',owner:'lin',done:true},{id:'c3',title:'卫生间清洁',icon:'🫧',desc:'清洁洗手台、地面和马桶',owner:'ke',done:false}],inventory:[{id:'i1',title:'垃圾袋',icon:'🛍️',qty:2,unit:'卷',threshold:3},{id:'i2',title:'洗手液',icon:'🧴',qty:1,unit:'瓶',threshold:2},{id:'i3',title:'抽纸',icon:'🧻',qty:8,unit:'包',threshold:3},{id:'i4',title:'洗洁精',icon:'🧼',qty:3,unit:'瓶',threshold:2}],rules:[{id:'r1',category:'作息',title:'安静时间',body:'晚上 23:00 至早上 8:00 保持安静，通话和游戏请佩戴耳机。',confirmed:['lin','qing','ke','an']},{id:'r2',category:'卫生',title:'公共区域随手整理',body:'使用厨房和客厅后，随手清理桌面与厨具，垃圾满了及时带走。',confirmed:['lin','qing','ke']},{id:'r3',category:'访客',title:'访客提前告知',body:'朋友来访或留宿，请至少提前一天在室友群里告知大家。',confirmed:['qing','ke','an']}]}}
    function load(){try{const raw=JSON.parse(localStorage.getItem(KEY));if(raw&&Array.isArray(raw.expenses)&&Array.isArray(raw.chores)&&Array.isArray(raw.inventory)&&Array.isArray(raw.rules))return raw}catch(e){}return seed()}
    let state=load(),page='home';
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmt=n=>'¥'+Number(n).toFixed(2).replace(/\.00$/,'');
    const member=id=>members.find(x=>x.id===id)||members[0];
    const face=(id,small=false)=>{let m=member(id);return `<span class="face" style="background:${m.bg};color:${m.color};${small?'width:24px;height:24px;font-size:10px':''}">${m.char}</span>`};
    const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
    const share=e=>Math.round(e.amount*100/e.people.length)/100;
    const exactShare=(e,id)=>{let cents=Math.round(e.amount*100),base=Math.floor(cents/e.people.length),extra=e.people.indexOf(id)<cents%e.people.length?1:0;return(base+extra)/100};
    const myDue=()=>state.expenses.filter(e=>e.people.includes('lin')&&!e.settled.includes('lin')).reduce((s,e)=>s+exactShare(e,'lin'),0);
    const pendingCount=()=>state.expenses.reduce((s,e)=>s+e.people.filter(p=>!e.settled.includes(p)).length,0);
    const lowItems=()=>state.inventory.filter(i=>i.qty<=i.threshold);
    const pendingChores=()=>state.chores.filter(c=>!c.done);
    const pendingRules=()=>state.rules.filter(r=>!r.confirmed.includes('lin'));
    const monthTotal=()=>state.expenses.filter(e=>e.date.slice(0,7)===todayISO().slice(0,7)).reduce((s,e)=>s+Number(e.amount),0);
    function header(kicker,title,sub,action=''){return `<div class="eyebrow">${kicker}</div><div class="heading"><div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}
    function renderHome(){const due=myDue(),pending=pendingChores(),low=lowItems(),rules=pendingRules();let recent=state.expenses.slice(0,3).map(e=>`<div class="activity"><div class="bubble green">${esc(e.icon||'💰')}</div><div class="info"><strong>${esc(e.title)}</strong><small>${member(e.payer).name} 付款 · ${e.people.length} 人分摊</small></div><span class="amount">${fmt(e.amount)}</span></div>`).join('');let tasks=[...pending.slice(0,2).map(c=>`<div class="todo-row"><div class="todo-icon">${c.icon}</div><div class="todo-title">${esc(c.title)}</div><span class="tag orange">${member(c.owner).name}待完成</span></div>`),...low.slice(0,2).map(i=>`<div class="todo-row"><div class="todo-icon">${i.icon}</div><div class="todo-title">${esc(i.title)}库存不足</div><span class="tag orange">剩 ${i.qty}${esc(i.unit)}</span></div>`)].join('');document.getElementById('home').innerHTML=header('GOOD TO BE HOME','早上好，小林 ☀️','一起把小家的日常安排得井井有条。',`<button class="btn" data-action="add-expense">＋ 快速记一笔</button>`)+`<div class="grid stats"><div class="card stat money"><div class="icon">¥</div><div class="label">我待支付</div><strong>${fmt(due)}</strong><span class="sub">待结算</span></div><div class="card stat chore"><div class="icon">✦</div><div class="label">待完成值日</div><strong>${pending.length}</strong><span class="sub">项任务</span></div><div class="card stat stock"><div class="icon">▤</div><div class="label">需补货物品</div><strong>${low.length}</strong><span class="sub">件物品</span></div><div class="card stat rules"><div class="icon">☷</div><div class="label">待确认公约</div><strong>${rules.length}</strong><span class="sub">条约定</span></div></div><div class="card hero"><div class="hero-copy"><div class="hero-kicker">🏠 WELCOME TO YOUR SHARED HOME</div><h2>一起住，刚刚好。</h2><p>账目清楚一点，分工公平一点，生活也更轻松一点。</p><button class="btn" data-page="chores">看看本周值日 →</button></div><div class="hero-art" aria-hidden="true">🪴</div></div><div class="grid overview-grid"><div><div class="section-head"><h2>最近费用</h2><button class="text-link" data-page="expenses">查看全部 →</button></div><div class="card panel"><div class="panel-head"><h3>共同账本</h3><span class="mini">本月共 ${fmt(monthTotal())}</span></div>${recent||'<div class="empty">暂无费用</div>'}</div></div><div><div class="section-head"><h2>家里待办</h2><button class="text-link" data-page="inventory">管理物品 →</button></div><div class="card panel"><div class="panel-head"><h3>这些事值得留意</h3><span class="mini">${pending.length+low.length} 项提醒</span></div>${tasks||'<div class="empty"><span>✨</span><strong>一切都安排好了</strong></div>'}</div></div></div>`}
    function renderExpenses(){const rows=state.expenses.map(e=>{const unsettled=e.people.filter(p=>!e.settled.includes(p));return `<div class="item-row"><div class="item-icon">${esc(e.icon||'💰')}</div><div class="item-main"><strong>${esc(e.title)}</strong><small>${esc(e.date)} · ${member(e.payer).name}垫付 · ${e.people.length} 人分摊 · 每人约 ${fmt(share(e))}</small></div><div class="item-end"><strong>${fmt(e.amount)}</strong><span class="tag ${unsettled.length?'orange':'green'}">${unsettled.length?`${unsettled.length} 人待结清`:'已结清'}</span></div><div class="item-actions"><button class="btn secondary small" data-action="detail-expense" data-id="${e.id}">查看分摊</button></div></div>`}).join('');let settled=state.expenses.reduce((s,e)=>s+e.settled.length,0),all=state.expenses.reduce((s,e)=>s+e.people.length,0);document.getElementById('expenses').innerHTML=header('SHARED EXPENSES','费用 AA','每一笔花费都清清楚楚，结算不用猜。',`<button class="btn" data-action="add-expense">＋ 记一笔费用</button>`)+`<div class="content-grid"><div><div class="section-head"><h2>费用明细</h2><span class="note">共 ${state.expenses.length} 笔</span></div><div class="card list-card">${rows||'<div class="empty"><span>🧾</span><strong>还没有费用记录</strong>点击右上角添加第一笔费用</div>'}</div></div><div><div class="section-head"><h2>结算概况</h2></div><div class="card summary-card"><h3>本月共同支出</h3><div class="summary-big">${fmt(monthTotal())}</div><p>所有室友的费用汇总</p><div class="bar"><span style="width:${all?settled/all*100:0}%"></span></div><div class="legend"><span>已结清 ${settled} 份</span><span>共 ${all} 份</span></div></div><div class="section-head"><h2>室友们</h2></div><div class="card summary-card"><div class="member-list">${members.map(m=>`<div class="member">${face(m.id)}<span class="name">${m.name}${m.id==='lin'?' · 我':''}</span><span class="meta">${state.expenses.filter(e=>e.people.includes(m.id)&&!e.settled.includes(m.id)).length} 笔待结</span></div>`).join('')}</div></div></div></div>`}
    function renderChores(){document.getElementById('chores').innerHTML=header('CLEAN HOME','清洁值日','分工看得见，家务不再靠“谁看见谁做”。',`<button class="btn" data-action="add-chore">＋ 添加任务</button>`)+`<div class="section-head"><h2>本周任务</h2><span class="note">已完成 ${state.chores.filter(c=>c.done).length} / ${state.chores.length}</span></div><div class="grid task-grid">${state.chores.map(c=>`<div class="card task-card"><div class="task-top"><div class="task-symbol">${esc(c.icon)}</div><span class="tag ${c.done?'green':'orange'}">${c.done?'✓ 已完成':'待完成'}</span></div><h3>${esc(c.title)}</h3><p>${esc(c.desc)}</p><div class="task-owner">${face(c.owner,true)}<span>本周由 <strong>${member(c.owner).name}</strong> 负责</span></div><div class="task-buttons"><button class="btn ${c.done?'secondary':''} small" data-action="toggle-chore" data-id="${c.id}">${c.done?'恢复待办':'✓ 标记完成'}</button><button class="btn secondary small" data-action="rotate-chore" data-id="${c.id}">换人负责</button></div></div>`).join('')||'<div class="card empty">暂无任务</div>'}</div><div class="demo-note">轮值演示：点击“换人负责”可选择室友，完成状态会同步到首页。</div>`}
    function renderInventory(){document.getElementById('inventory').innerHTML=header('SHARED SUPPLIES','公共物品','日用品还剩多少、该买什么，一眼就知道。',`<button class="btn" data-action="add-item">＋ 登记物品</button>`)+`<div class="section-head"><h2>物品清单</h2><span class="note">${lowItems().length} 件需要补货</span></div><div class="grid inventory-grid">${state.inventory.map(i=>{let low=i.qty<=i.threshold,max=Math.max(i.threshold*3,1);return `<div class="card inventory-card"><div class="big-icon">${esc(i.icon)}</div><h3>${esc(i.title)}</h3><p>提醒线：${i.threshold}${esc(i.unit)}</p><div class="stock-line"><div><strong>${i.qty}</strong><small>${esc(i.unit)}剩余</small></div><span class="tag ${low?'orange':'green'}">${low?'需要补货':'库存充足'}</span></div><div class="bar"><span style="width:${Math.min(100,i.qty/max*100)}%;background:${low?'#e99a61':'var(--green)'}"></span></div><div class="item-actions"><button class="btn secondary small" data-action="consume-item" data-id="${i.id}" ${i.qty<1?'disabled':''}>− 消耗 1${esc(i.unit)}</button><button class="btn small" data-action="restock-item" data-id="${i.id}">＋ 补货</button></div></div>`}).join('')||'<div class="card empty">暂无物品</div>'}</div>`}
    function renderRules(){document.getElementById('rules').innerHTML=header('OUR HOUSE RULES','室友公约','让彼此舒服的小约定，大家一起确认。',`<button class="btn" data-action="add-rule">＋ 新增公约</button>`)+`<div class="section-head"><h2>我们的小约定</h2><span class="note">共 ${state.rules.length} 条</span></div><div class="rules-list">${state.rules.map((r,n)=>`<div class="card rule-card"><div class="rule-index">${String(n+1).padStart(2,'0')}</div><div class="rule-content"><h3>${esc(r.title)} <span class="tag purple">${esc(r.category)}</span></h3><p>${esc(r.body)}</p><div class="rule-foot"><span>${r.confirmed.length}/${members.length} 位室友已确认</span><span>·</span><span>${r.confirmed.includes('lin')?'你已确认':'等待你确认'}</span></div></div><div class="item-actions">${r.confirmed.includes('lin')?'<span class="tag green">✓ 已确认</span>':`<button class="btn small" data-action="confirm-rule" data-id="${r.id}">我已了解</button>`}</div></div>`).join('')||'<div class="card empty">暂无公约</div>'}</div>`}
    const titles={home:'总览',expenses:'费用 AA',chores:'清洁值日',inventory:'公共物品',rules:'室友公约'};
    function render(){renderHome();renderExpenses();renderChores();renderInventory();renderRules();document.getElementById('sideDue').textContent=pendingCount();document.getElementById('avatarStack').innerHTML=members.map(m=>`<span title="${m.name}" style="background:${m.bg};color:${m.color}">${m.char}</span>`).join('');document.getElementById('today').textContent=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'long'}).format(new Date());setPage(page,false)}
    function setPage(next,scroll=true){if(!titles[next])return;page=next;document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id===next));document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===next));document.getElementById('crumbTitle').textContent=titles[next];if(scroll)window.scrollTo({top:0,behavior:'smooth'})}
    function toast(message){let el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('show'),2500)}
    function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalBackdrop').classList.add('open');document.body.style.overflow='hidden';setTimeout(()=>document.querySelector('#modalBody input,#modalBody select,#modalBody textarea')?.focus(),40)}
    function closeModal(){document.getElementById('modalBackdrop').classList.remove('open');document.body.style.overflow=''}
    const foot=(label='保存')=>`<div class="modal-foot"><button class="btn secondary" type="button" data-action="close-modal">取消</button><button class="btn" type="submit">${label}</button></div>`;
    function expenseForm(){openModal('记一笔共同费用',`<form id="expenseForm"><div class="field"><label for="expenseTitle">费用名称</label><input id="expenseTitle" name="title" placeholder="例如：本月水费" required maxlength="40"></div><div class="field-grid"><div class="field"><label for="expenseAmount">金额（元）</label><input id="expenseAmount" name="amount" type="number" min="0.01" max="999999" step="0.01" placeholder="0.00" required></div><div class="field"><label for="expensePayer">谁付款</label><select id="expensePayer" name="payer">${members.map(m=>`<option value="${m.id}" ${m.id==='lin'?'selected':''}>${m.name}</option>`).join('')}</select></div></div><div class="field"><label>参与分摊的室友（平均分摊）</label><div class="check-grid">${members.map(m=>`<label class="check-pill"><input type="checkbox" name="people" value="${m.id}" checked>${m.name}</label>`).join('')}</div></div><p class="note">付款人会自动标记为已结清；其余室友可在费用详情中确认结清。</p>${foot('保存费用')}</form>`)}
    function expenseDetail(id){let e=state.expenses.find(x=>x.id===id);if(!e)return;let cents=Math.round(e.amount*100),base=Math.floor(cents/e.people.length),remainder=cents%e.people.length;openModal(esc(e.title),`<div class="summary-card" style="padding:0 0 16px"><div class="summary-big">${fmt(e.amount)}</div><p>${member(e.payer).name} 付款 · ${esc(e.date)} · ${e.people.length} 人分摊</p></div><div class="member-list" style="border-top:1px solid var(--line);padding-top:18px">${e.people.map((id,index)=>{let amount=(base+(index<remainder?1:0))/100;return `<div class="member">${face(id)}<span class="name">${member(id).name}${id===e.payer?' · 付款人':''}</span><span style="font-weight:700;margin-right:8px">${fmt(amount)}</span>${e.settled.includes(id)?'<span class="tag green">已结清</span>':`<button class="btn small" data-action="settle-expense" data-id="${e.id}" data-member="${id}">标记已结</button>`}</div>`}).join('')}</div><div class="modal-foot" style="margin-top:23px"><button class="btn warn small" data-action="delete-expense" data-id="${e.id}">删除这笔费用</button><button class="btn secondary" data-action="close-modal">关闭</button></div>`)}
    function choreForm(){openModal('添加清洁任务',`<form id="choreForm"><div class="field"><label for="choreTitle">任务名称</label><input id="choreTitle" name="title" required maxlength="30" placeholder="例如：擦拭客厅桌面"></div><div class="field"><label for="choreDesc">任务说明</label><textarea id="choreDesc" name="desc" maxlength="100" placeholder="写清楚完成标准"></textarea></div><div class="field"><label for="choreOwner">本周负责人</label><select id="choreOwner" name="owner">${members.map(m=>`<option value="${m.id}">${m.name}</option>`).join('')}</select></div>${foot('添加任务')}</form>`)}
    function rotateChore(id){let c=state.chores.find(x=>x.id===id);if(!c)return;openModal('调整负责人',`<form id="rotateForm" data-id="${id}"><p class="note" style="margin-top:0">${esc(c.title)}当前由 ${member(c.owner).name} 负责。</p><div class="field"><label for="newOwner">选择新负责人</label><select id="newOwner" name="owner">${members.map(m=>`<option value="${m.id}" ${m.id===c.owner?'selected':''}>${m.name}</option>`).join('')}</select></div>${foot('确认调整')}</form>`)}
    function itemForm(){openModal('登记公共物品',`<form id="itemForm"><div class="field"><label for="itemTitle">物品名称</label><input id="itemTitle" name="title" maxlength="30" placeholder="例如：洗衣液" required></div><div class="field-grid"><div class="field"><label for="itemQty">当前数量</label><input id="itemQty" name="qty" type="number" min="0" max="9999" step="1" value="1" required></div><div class="field"><label for="itemUnit">单位</label><input id="itemUnit" name="unit" maxlength="8" value="件" required></div></div><div class="field"><label for="itemThreshold">低库存提醒线</label><input id="itemThreshold" name="threshold" type="number" min="0" max="9999" step="1" value="2" required></div>${foot('登记物品')}</form>`)}
    function restockForm(id){let i=state.inventory.find(x=>x.id===id);if(!i)return;openModal(`补货 · ${i.title}`,`<form id="restockForm" data-id="${id}"><div class="field-grid"><div class="field"><label for="restockQty">增加数量（${esc(i.unit)}）</label><input id="restockQty" name="qty" type="number" min="1" max="9999" step="1" value="1" required></div><div class="field"><label for="restockAmount">采购金额（选填）</label><input id="restockAmount" name="amount" type="number" min="0" max="999999" step="0.01" placeholder="填金额可同时记入 AA"></div></div><p class="note">填写采购金额后，会自动创建一笔由你垫付、4 位室友均摊的费用。</p>${foot('确认补货')}</form>`)}
    function ruleForm(){openModal('新增室友公约',`<form id="ruleForm"><div class="field"><label for="ruleCategory">分类</label><select id="ruleCategory" name="category"><option>作息</option><option>卫生</option><option>访客</option><option>费用</option><option>其他</option></select></div><div class="field"><label for="ruleTitle">公约标题</label><input id="ruleTitle" name="title" required maxlength="30" placeholder="一句话说明约定"></div><div class="field"><label for="ruleBody">具体内容</label><textarea id="ruleBody" name="body" required maxlength="200" placeholder="写清楚大家如何执行"></textarea></div><p class="note">新增公约默认由你确认，其他室友显示为待确认。</p>${foot('保存公约')}</form>`)}
    document.addEventListener('click',e=>{let nav=e.target.closest('[data-page]');if(nav){setPage(nav.dataset.page);return}let b=e.target.closest('[data-action]');if(!b)return;let id=b.dataset.id;switch(b.dataset.action){case'add-expense':expenseForm();break;case'detail-expense':expenseDetail(id);break;case'settle-expense':{let x=state.expenses.find(v=>v.id===id);if(x&&!x.settled.includes(b.dataset.member)){x.settled.push(b.dataset.member);save();render();expenseDetail(id);toast('已标记结清')}break}case'delete-expense':if(confirm('确定删除这笔费用吗？')){state.expenses=state.expenses.filter(x=>x.id!==id);save();closeModal();render();toast('费用已删除')}break;case'add-chore':choreForm();break;case'toggle-chore':{let x=state.chores.find(v=>v.id===id);if(x){x.done=!x.done;save();render();toast(x.done?'值日已完成':'已恢复为待办')}break}case'rotate-chore':rotateChore(id);break;case'add-item':itemForm();break;case'consume-item':{let x=state.inventory.find(v=>v.id===id);if(x&&x.qty>0){x.qty--;save();render();toast(x.qty<=x.threshold?'已记录消耗，库存接近提醒线':'已记录消耗')}break}case'restock-item':restockForm(id);break;case'add-rule':ruleForm();break;case'confirm-rule':{let x=state.rules.find(v=>v.id===id);if(x&&!x.confirmed.includes('lin')){x.confirmed.push('lin');save();render();toast('已确认公约')}break}case'close-modal':closeModal();break}});
    document.addEventListener('submit',e=>{let f=e.target;if(!['expenseForm','choreForm','rotateForm','itemForm','restockForm','ruleForm'].includes(f.id))return;e.preventDefault();let d=new FormData(f);if(f.id==='expenseForm'){let people=d.getAll('people');let amount=Number(d.get('amount'));if(!people.length){toast('请至少选择一位室友');return}if(!(amount>0)){toast('请输入有效金额');return}let payer=d.get('payer');state.expenses.unshift({id:crypto.randomUUID(),title:String(d.get('title')).trim(),amount:Math.round(amount*100)/100,payer,people,settled:people.includes(payer)?[payer]:[],date:todayISO(),icon:'💰'});page='expenses';toast('费用已添加')}else if(f.id==='choreForm'){state.chores.push({id:crypto.randomUUID(),title:String(d.get('title')).trim(),desc:String(d.get('desc')).trim()||'完成后记得标记哦',owner:d.get('owner'),icon:'🧹',done:false});page='chores';toast('任务已添加')}else if(f.id==='rotateForm'){let c=state.chores.find(x=>x.id===f.dataset.id);if(c)c.owner=d.get('owner');toast('负责人已调整')}else if(f.id==='itemForm'){state.inventory.push({id:crypto.randomUUID(),title:String(d.get('title')).trim(),icon:'📦',qty:Number(d.get('qty')),unit:String(d.get('unit')).trim(),threshold:Number(d.get('threshold'))});page='inventory';toast('物品已登记')}else if(f.id==='restockForm'){let i=state.inventory.find(x=>x.id===f.dataset.id),qty=Number(d.get('qty')),amount=Number(d.get('amount'));if(i){i.qty+=qty;if(amount>0){state.expenses.unshift({id:crypto.randomUUID(),title:`采购 · ${i.title}`,amount:Math.round(amount*100)/100,payer:'lin',people:members.map(m=>m.id),settled:['lin'],date:todayISO(),icon:'🛒'});toast('已补货并记入 AA')}else toast('补货成功')}}else if(f.id==='ruleForm'){state.rules.push({id:crypto.randomUUID(),category:d.get('category'),title:String(d.get('title')).trim(),body:String(d.get('body')).trim(),confirmed:['lin']});page='rules';toast('公约已添加')}save();closeModal();render()});
    document.getElementById('closeModal').addEventListener('click',closeModal);document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});document.getElementById('resetDemo').addEventListener('click',()=>{if(confirm('重置演示数据？当前浏览器保存的操作会被清除。')){state=seed();save();page='home';render();toast('演示数据已重置')}});
    render();
  </script>
</body>
</html>
